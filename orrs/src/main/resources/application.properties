# ===============================
# Application Identity
# ===============================
spring.application.name=ORRS
server.port=8080

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/orrs?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
#spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Logging (Helpful for Defense)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO

# ===============================
# Jackson (JSON Handling)
# ===============================
spring.jackson.serialization.indent_output=true
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# ===============================
# File Upload (future: reports, gait videos)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Security (Phase 1: Basic, no Spring Security yet)
# ===============================

# ===============================
# Actuator (Optional but looks professional)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# JWT Security
# ===============================
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32+CHARS
app.jwt.expirationMinutes=60
app.cors.allowedOrigins=http://localhost:5173
app.ai.baseUrl=http://127.0.0.1:8001

# ===============================
# Logging (AI integration)
# ===============================
logging.level.com.orrs.service=DEBUG
logging.level.com.orrs=INFO
